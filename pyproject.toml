[project]
name = "card-collector"
version = "0.1.0"
description = "Open source card collection manager with CV card detection and retrieval"
authors = [{ name = "Open Card Collector" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "huggingface-hub>=1.31.0",
]

[project.optional-dependencies]
background-generation = [
    "accelerate>=1.0.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "safetensors>=0.4.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
]
detector-training = [
    "ultralytics>=8.3.0",
]
embedder-training = [
    "protobuf>=5.0.0",
    "sentencepiece>=0.2.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
